services:
  server:
    build:
      context: ..
      dockerfile: finance-server/Dockerfile
    profiles: ["server"]
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/finance?connectionTimeZone=UTC}
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      FINANCE_READER_PASSWORD: ${FINANCE_READER_PASSWORD:?set FINANCE_READER_PASSWORD}
      FINANCE_ADMIN_PASSWORD: ${FINANCE_ADMIN_PASSWORD:?set FINANCE_ADMIN_PASSWORD}
      FINANCE_IMPORTER_PASSWORD: ${FINANCE_IMPORTER_PASSWORD:?set FINANCE_IMPORTER_PASSWORD}
    ports: ["127.0.0.1:8081:8081"]

volumes:
  mysql-data:
