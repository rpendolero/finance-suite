name: Finance Suite CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preload Testcontainers images with registry fallbacks
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config['registry-mirrors'] = list(dict.fromkeys(['https://mirror.gcr.io', *config.get('registry-mirrors', [])]))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
          pull_image() {
            local target="$1"
            shift
            for source in "$@"; do
              if docker pull "$source"; then
                if [ "$source" != "$target" ]; then
                  docker tag "$source" "$target"
                fi
                return 0
              fi
            done
            return 1
          }
          pull_image mysql:8.4 mysql:8.4 public.ecr.aws/docker/library/mysql:8.4
          pull_image testcontainers/ryuk:0.12.0 ghcr.io/testcontainers/ryuk:0.12.0 testcontainers/ryuk:0.12.0
          pull_image alpine:3.17 alpine:3.17 public.ecr.aws/docker/library/alpine:3.17
      - name: Build and test Maven modules
        run: mvn -B verify

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test dashboard
        run: npm test
      - name: Build dashboard
        run: npm run build
