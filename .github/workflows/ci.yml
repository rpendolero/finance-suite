name: Finance Suite CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preload Testcontainers images from public mirrors
        run: |
          docker pull public.ecr.aws/docker/library/mysql:8.4
          docker tag public.ecr.aws/docker/library/mysql:8.4 mysql:8.4
          docker pull ghcr.io/testcontainers/ryuk:0.12.0
          docker tag ghcr.io/testcontainers/ryuk:0.12.0 testcontainers/ryuk:0.12.0
          docker pull public.ecr.aws/docker/library/alpine:3.17
          docker tag public.ecr.aws/docker/library/alpine:3.17 alpine:3.17
      - name: Build and test Maven modules
        run: mvn -B verify

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test dashboard
        run: npm test
      - name: Build dashboard
        run: npm run build
