spring:
  main:
    web-application-type: none
    banner-mode: off
finance:
  importer:
    server-url: ${FINANCE_SERVER_URL:http://127.0.0.1:8081}
    password: ${FINANCE_IMPORTER_PASSWORD}
  browser:
    enabled: ${BROWSER_ENABLED:false}
    profile-dir: ${BROWSER_PROFILE_DIR:./private/browser-profiles}
    download-dir: ${BROWSER_DOWNLOAD_DIR:./private/downloads}

logging:
  level:
    com.finance: ${FINANCE_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%X{correlationId:-none}] %logger{36} - %msg%n"
