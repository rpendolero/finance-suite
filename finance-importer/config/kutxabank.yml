# Configuración privada: indica el nombre accesible de la cuenta que grabó codegen.
finance:
  importer:
    jobs:
      kutxabank-excel:
        product-id: kutxa-account
        provider: KUTXABANK
        input-file: /mnt/workspace/finance-suite/private/kutxa-account.xls
        product-file: /mnt/workspace/finance-suite/private/kutxa_account.json
      kutxabank-card-excel:
        product-id: kutxa-credit
        provider: KUTXABANK
        input-file: /mnt/workspace/finance-suite/private/kutxa-credit.xls
        product-file: /mnt/workspace/finance-suite/private/kutxa_credit.json
      kutxabank-card-browser:
        product-id: kutxa-credit
        provider: KUTXABANK
        export-key: tarjeta
      kutxabank-browser:
        product-id: kutxa-account
        provider: KUTXABANK
        export-key: cuenta-principal
  browser:
    enabled: true
    channel: chrome
    providers:
      KUTXABANK:
        login-url: https://clientes.kutxabank.es/
        exports:
          cuenta-principal:
            flow: KUTXABANK_ACCOUNT
            account-name: 2095 0537 90
            from: 2026-09-01
            to: 2026-10-01
          tarjeta:
            flow: KUTXABANK_CARD
            card-name: 4921074096005205
            from: 2026-09-01
            to: 2026-10-01
